[project]
name = "warden"
version = "0.1.0"
description = "Autonomous long-horizon goal and time arbitration agent powered by Google ADK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=0.1.0",
    "google-genai>=0.1.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.1",
    "google-cloud-firestore>=2.16.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
