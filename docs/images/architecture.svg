<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="640" viewBox="0 0 1640 640" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12171d"/>
      <stop offset="55%" stop-color="#0f141a"/>
      <stop offset="100%" stop-color="#141a20"/>
    </linearGradient>
    <linearGradient id="eyeInk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cdeeda"/>
      <stop offset="55%" stop-color="#8fbba3"/>
      <stop offset="100%" stop-color="#6fa088"/>
    </linearGradient>
    <linearGradient id="agentFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2c26"/>
      <stop offset="100%" stop-color="#18241f"/>
    </linearGradient>
    <linearGradient id="coreFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c232c"/>
      <stop offset="100%" stop-color="#171d25"/>
    </linearGradient>
    <linearGradient id="gateFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2418"/>
      <stop offset="100%" stop-color="#241e14"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <marker id="arw" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#8fbba3"/>
    </marker>
    <marker id="arwMuted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#7f8b96"/>
    </marker>
    <marker id="arwWarm" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#d9a05b"/>
    </marker>
  </defs>

  <rect width="1640" height="640" fill="url(#bg)"/>

  <!-- title -->
  <text x="60" y="58" fill="#cad2d9" font-size="27" letter-spacing="0.5">Blink</text>
  <text x="131" y="58" fill="#6c757e" font-size="17" font-style="italic">a planning partner that keeps working after the conversation ends</text>

  <!-- ============ YOU ============ -->
  <g>
    <ellipse cx="152" cy="300" rx="86" ry="64" fill="#8fbba3" opacity="0.07" filter="url(#softglow)"/>
    <rect x="52" y="238" width="200" height="126" rx="22" fill="#191f26" stroke="#2a323b" stroke-width="1.5"/>
    <!-- the eyes motif -->
    <g filter="url(#glow)">
      <rect x="122" y="268" width="20" height="30" rx="10" fill="url(#eyeInk)"/>
      <rect x="162" y="268" width="20" height="30" rx="10" fill="url(#eyeInk)"/>
    </g>
    <text x="152" y="330" fill="#cad2d9" font-size="19" text-anchor="middle">You</text>
    <text x="152" y="351" fill="#6c757e" font-size="12.5" text-anchor="middle" font-family="Menlo, monospace">web · phone · notifications</text>
  </g>

  <!-- ============ CLOUD RUN ============ -->
  <rect x="330" y="150" width="740" height="300" rx="20" fill="#8fbba3" opacity="0.028"/>
  <rect x="330" y="150" width="740" height="300" rx="20" fill="none" stroke="#2f3a44" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="350" y="178" fill="#7f8b96" font-size="13" letter-spacing="2.2" font-family="Menlo, monospace">GOOGLE CLOUD RUN</text>

  <!-- agent -->
  <rect x="360" y="200" width="322" height="212" rx="18" fill="url(#agentFill)" stroke="#8fbba3" stroke-width="2"/>
  <text x="521" y="243" fill="#cdeeda" font-size="20" text-anchor="middle">Gemini 3.5 Flash</text>
  <text x="521" y="269" fill="#cdeeda" font-size="20" text-anchor="middle">+ ADK agent</text>
  <line x1="404" y1="288" x2="638" y2="288" stroke="#8fbba3" stroke-width="1" opacity="0.28"/>
  <text x="521" y="315" fill="#97a1aa" font-size="14" text-anchor="middle" font-family="Menlo, monospace">28 typed tools</text>
  <text x="521" y="340" fill="#97a1aa" font-size="14" text-anchor="middle" font-family="Menlo, monospace">chosen from their docstrings</text>
  <text x="521" y="381" fill="#8fbba3" font-size="17.5" text-anchor="middle" font-style="italic">decides what to do</text>

  <!-- core -->
  <rect x="718" y="200" width="322" height="212" rx="18" fill="url(#coreFill)" stroke="#7f97b5" stroke-width="2"/>
  <text x="879" y="243" fill="#d3dbe4" font-size="20" text-anchor="middle">Deterministic core</text>
  <line x1="762" y1="264" x2="996" y2="264" stroke="#7f97b5" stroke-width="1" opacity="0.28"/>
  <text x="879" y="292" fill="#97a1aa" font-size="14" text-anchor="middle" font-family="Menlo, monospace">capacity · scheduling</text>
  <text x="879" y="316" fill="#97a1aa" font-size="14" text-anchor="middle" font-family="Menlo, monospace">progress · streaks</text>
  <text x="879" y="341" fill="#6c757e" font-size="13" text-anchor="middle" font-family="Menlo, monospace">no model in this loop</text>
  <text x="879" y="381" fill="#9fb6d1" font-size="17.5" text-anchor="middle" font-style="italic">computes what is true</text>

  <!-- agent <-> core -->
  <line x1="690" y1="306" x2="710" y2="306" stroke="#7f8b96" stroke-width="2" marker-start="url(#arwMuted)" marker-end="url(#arwMuted)"/>

  <!-- ============ THE GATE ============ -->
  <rect x="1128" y="243" width="176" height="126" rx="18" fill="url(#gateFill)" stroke="#d9a05b" stroke-width="2"/>
  <text x="1216" y="288" fill="#e8bd80" font-size="19" text-anchor="middle">your yes</text>
  <text x="1216" y="313" fill="#a2865f" font-size="12.5" text-anchor="middle" font-family="Menlo, monospace">write tools are</text>
  <text x="1216" y="332" fill="#a2865f" font-size="12.5" text-anchor="middle" font-family="Menlo, monospace">unreachable until</text>
  <text x="1216" y="351" fill="#a2865f" font-size="12.5" text-anchor="middle" font-family="Menlo, monospace">you confirm</text>

  <!-- ============ GOOGLE CALENDAR ============ -->
  <rect x="1372" y="243" width="216" height="126" rx="18" fill="#191f26" stroke="#3a444f" stroke-width="1.5"/>
  <text x="1480" y="292" fill="#cad2d9" font-size="19" text-anchor="middle">Google Calendar</text>
  <text x="1480" y="320" fill="#6c757e" font-size="13" text-anchor="middle" font-family="Menlo, monospace">real events, moved</text>
  <text x="1480" y="340" fill="#6c757e" font-size="13" text-anchor="middle" font-family="Menlo, monospace">and deleted for real</text>

  <!-- ============ FIRESTORE ============ -->
  <g>
    <ellipse cx="879" cy="512" rx="128" ry="20" fill="#191f26" stroke="#3a444f" stroke-width="1.5"/>
    <path d="M 751 512 L 751 566 A 128 20 0 0 0 1007 566 L 1007 512" fill="#191f26" stroke="#3a444f" stroke-width="1.5"/>
    <text x="879" y="548" fill="#cad2d9" font-size="17" text-anchor="middle">Firestore</text>
    <text x="879" y="572" fill="#6c757e" font-size="12.5" text-anchor="middle" font-family="Menlo, monospace">what survived, what did not</text>
  </g>

  <!-- ============ EDGES ============ -->
  <!-- you -> agent -->
  <path d="M 256 300 L 352 300" fill="none" stroke="#8fbba3" stroke-width="2" marker-end="url(#arw)"/>
  <text x="304" y="288" fill="#7f8b96" font-size="12.5" text-anchor="middle" font-family="Menlo, monospace">a turn</text>

  <!-- agent -> gate -->
  <path d="M 1074 300 L 1120 300" fill="none" stroke="#d9a05b" stroke-width="2" marker-end="url(#arwWarm)"/>
  <!-- gate -> calendar -->
  <path d="M 1308 306 L 1364 306" fill="none" stroke="#d9a05b" stroke-width="2" marker-end="url(#arwWarm)"/>

  <!-- core -> firestore -->
  <path d="M 879 416 L 879 488" fill="none" stroke="#7f8b96" stroke-width="2" marker-end="url(#arwMuted)"/>

  <!-- firestore -> agent (learns) -->
  <path d="M 751 545 C 560 545, 470 500, 470 420" fill="none" stroke="#8fbba3" stroke-width="2" stroke-dasharray="6 6" opacity="0.75" marker-end="url(#arw)"/>
  <text x="556" y="497" fill="#8fbba3" font-size="13.5" font-style="italic" opacity="0.85">learns</text>

  <!-- footnote -->
  <text x="60" y="612" fill="#5b646d" font-size="13" font-family="Menlo, monospace">Vertex AI · Cloud Text-to-Speech (Chirp 3 HD) · Google Calendar OAuth · FastAPI on Cloud Run · SwiftUI companion</text>
</svg>
